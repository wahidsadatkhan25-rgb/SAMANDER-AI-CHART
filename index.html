
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080d18">
<title>SAMANDER AI OTC</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#080d18;color:#f4f7ff;font-family:Arial,sans-serif}
header{padding:22px 18px;background:#101a2b;border-bottom:1px solid #26364e}
.logo{font-size:25px;font-weight:900}
.logo span{color:#20c8f4}
.tag{font-size:11px;color:#8fa4bd;margin-top:7px;letter-spacing:2px}
main{max-width:760px;margin:auto;padding:18px 14px}
.card{background:#111c2e;border:1px solid #26364e;border-radius:16px;padding:18px;margin-bottom:16px}
.heading{font-size:16px;font-weight:bold;margin-bottom:15px}
.number{color:#23c8f1;margin-right:8px}
label{display:block;color:#a8b7cb;font-size:13px;margin-bottom:9px}
select{width:100%;padding:15px;background:#0a1424;color:white;border:1px solid #344761;border-radius:10px;font-size:15px}
.upload{display:block;border:2px dashed #31516d;border-radius:13px;padding:27px 12px;text-align:center;background:#0a1424;cursor:pointer}
.upload strong{display:block;color:#26c9f3;font-size:16px;margin-bottom:8px}
.upload small{color:#8da1ba}
input[type=file]{display:none}
#preview{display:none;width:100%;max-height:360px;object-fit:contain;margin-top:14px;border-radius:10px}
button{width:100%;padding:15px;border:0;border-radius:10px;background:#13a9d5;color:white;font-size:14px;font-weight:bold;margin-top:13px}
button:disabled{opacity:.45}
.secondary{background:#26364d}
.status{font-size:12px;color:#35c8ef;margin-top:12px;line-height:1.5}
.result{background:#0a1424;border:1px solid #344761;border-radius:13px;padding:20px;text-align:center}
.signal{font-size:27px;font-weight:900;color:#f5c45a;margin:12px}
.muted{color:#91a3bb;font-size:13px;line-height:1.7;white-space:pre-wrap}
.history-item{border-top:1px solid #26364e;padding:12px 0;font-size:13px;color:#c0ccda;line-height:1.6}
footer{text-align:center;padding:22px;color:#70839d;font-size:11px;line-height:1.7}
</style>
</head>
<body>
<header>
 <div class="logo">SAMANDER <span>AI</span></div>
 <div class="tag">POCKET OPTION OTC ANALYZER</div>
</header>
<main>
 <section class="card">
  <div class="heading"><span class="number">01</span> SELECT OTC PAIR</div>
  <label for="pair">Choose your trading pair</label>
  <select id="pair">
   <option>AUD/CAD OTC</option>
   <option>AUD/USD OTC</option>
   <option>EUR/USD OTC</option>
   <option>GBP/USD OTC</option>
   <option>USD/JPY OTC</option>
   <option>EUR/GBP OTC</option>
   <option>NZD/USD OTC</option>
   <option>USD/CHF OTC</option>
   <option>GBP/JPY OTC</option>
   <option>EUR/JPY OTC</option>
   <option>USD/CAD OTC</option>
   <option>GBP/AUD OTC</option>
  </select>
 </section>

 <section class="card">
  <div class="heading"><span class="number">02</span> UPLOAD CHART</div>
  <label>Choose a clear Pocket Option 1-minute chart screenshot.</label>
  <label class="upload" for="chartFile">
   <strong>＋ UPLOAD SCREENSHOT</strong>
   <small>JPG · PNG · WEBP</small>
  </label>
  <input id="chartFile" type="file" accept="image/png,image/jpeg,image/webp">
  <img id="preview" alt="Chart preview">
  <button id="removeBtn" class="secondary" style="display:none">REMOVE IMAGE</button>
  <button id="analyzeBtn" disabled>ANALYZE 1-MINUTE CHART</button>
  <div class="status" id="uploadStatus">Waiting for screenshot...</div>
 </section>

 <section class="card">
  <div class="heading"><span class="number">03</span> AI ANALYSIS</div>
  <div class="result">
   <div class="muted">NEXT CANDLE ESTIMATE</div>
   <div class="signal" id="signal">WAIT</div>
   <div class="muted" id="resultText">Upload a screenshot to begin.</div>
  </div>
 </section>

 <section class="card">
  <div class="heading"><span class="number">04</span> ANALYSIS HISTORY</div>
  <div id="history" class="muted">No analysis yet.</div>
  <button id="clearHistory" class="secondary">CLEAR HISTORY</button>
 </section>
</main>
<footer>SAMANDER AI OTC<br>AI estimates are uncertain. Demo testing only.</footer>

<script>
const $=id=>document.getElementById(id);
let selectedFile=null;
let previewURL=null;

$("chartFile").addEventListener("change",()=>{
 const file=$("chartFile").files[0];
 if(!file)return;

 if(!["image/jpeg","image/png","image/webp"].includes(file.type)){
  $("uploadStatus").textContent="Choose JPG, PNG or WEBP.";
  $("chartFile").value="";
  return;
 }

 selectedFile=file;
 if(previewURL)URL.revokeObjectURL(previewURL);
 previewURL=URL.createObjectURL(file);
 $("preview").src=previewURL;
 $("preview").style.display="block";
 $("removeBtn").style.display="block";
 $("analyzeBtn").disabled=false;
 $("uploadStatus").textContent="Screenshot ready: "+file.name;
 $("signal").textContent="READY";
 $("resultText").textContent="Ready to analyze your chart.";
});

$("removeBtn").addEventListener("click",()=>{
 selectedFile=null;
 $("chartFile").value="";
 if(previewURL)URL.revokeObjectURL(previewURL);
 previewURL=null;
 $("preview").style.display="none";
 $("removeBtn").style.display="none";
 $("analyzeBtn").disabled=true;
 $("uploadStatus").textContent="Waiting for screenshot...";
 $("signal").textContent="WAIT";
 $("resultText").textContent="Upload a screenshot to begin.";
});

$("analyzeBtn").addEventListener("click",async()=>{
 if(!selectedFile)return;

 const button=$("analyzeBtn");
 button.disabled=true;
 button.textContent="ANALYZING...";
 $("signal").textContent="WAIT";
 $("resultText").textContent="AI is examining the screenshot...";

 const data=new FormData();
 data.append("image",selectedFile);
 data.append("pair",$("pair").value);

 try{
  const response=await fetch("/analyze",{
   method:"POST",
   body:data
  });
  const result=await response.json();

  if(!response.ok)throw new Error(result.error||"Analysis failed");

  const analysis=result.analysis||"No analysis returned.";
  const match=analysis.match(/ESTIMATE:\s*(BUY|SELL|WAIT)/i);
  const direction=match?match[1].toUpperCase():"WAIT";

  $("signal").textContent=direction;
  $("resultText").textContent=analysis;

  saveHistory($("pair").value,direction,analysis);
  $("uploadStatus").textContent="Analysis completed.";
 }catch(error){
  $("signal").textContent="WAIT";
  $("resultText").textContent=error.message;
  $("uploadStatus").textContent="Could not complete analysis.";
 }finally{
  button.disabled=!selectedFile;
  button.textContent="ANALYZE 1-MINUTE CHART";
 }
});

function saveHistory(pair,direction,analysis){
 const records=JSON.parse(localStorage.getItem("samanderHistory")||"[]");
 records.unshift({
  pair,
  direction,
  analysis,
  date:new Date().toLocaleString()
 });
 localStorage.setItem("samanderHistory",JSON.stringify(records.slice(0,20)));
 showHistory();
}

function showHistory(){
 const records=JSON.parse(localStorage.getItem("samanderHistory")||"[]");
 const box=$("history");
 box.replaceChildren();

 if(!records.length){
  box.textContent="No analysis yet.";
  return;
 }

 records.forEach(item=>{
  const div=document.createElement("div");
  div.className="history-item";
  const heading=document.createElement("strong");
  heading.textContent=item.pair+" — "+item.direction;
  const date=document.createElement("div");
  date.textContent=item.date;
  div.append(heading,date);
  box.appendChild(div);
 });
}

$("clearHistory").addEventListener("click",()=>{
 localStorage.removeItem("samanderHistory");
 showHistory();
});

showHistory();
</script>
</body>
</html>
